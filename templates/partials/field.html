{% load newsroom %}
<div class="field{% if field|is_checkbox %} field--check{% endif %}{% if field|is_richtext %} field--wide{% endif %}">
  {% if field|is_checkbox %}
    {{ field }}
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {% else %}
    {% if not hide_label %}<label for="{{ field.id_for_label }}">{{ field.label }}</label>{% endif %}
    {{ field }}
  {% endif %}
  {% if field.help_text %}<p class="help">{{ field.help_text }}</p>{% endif %}
  {{ field.errors }}
</div>
