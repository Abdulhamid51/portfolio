<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saytda nosozlik</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f6f1e5">
  <!-- Bu sahifa hech qanday ma'lumotlar bazasiga murojaat qilmaydi:
       server xatosi paytida ham ochilishi kerak. -->
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
      background: #f6f1e5;
      color: #1c1a16;
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.6;
      box-sizing: border-box;
    }
    .box { max-width: 34rem; text-align: center; }
    .code {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: .3em;
      text-transform: uppercase;
      color: #98301f;
      margin: 0 0 1rem;
    }
    h1 { font-size: clamp(1.8rem, 6vw, 2.8rem); line-height: 1.15; margin: 0 0 .75rem; letter-spacing: -.02em; }
    p { color: #4b463d; margin: 0 0 1.75rem; }
    a {
      display: inline-block;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: .78rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      text-decoration: none;
      color: #f6f1e5;
      background: #1c1a16;
      border: 1px solid #1c1a16;
      border-radius: 3px;
      padding: .7rem 1.2rem;
    }
    a:hover { background: #98301f; border-color: #98301f; }
    hr { border: 0; border-top: 3px double #b7ab92; margin: 2rem 0 1.25rem; }
    small { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: #7d766a; }
    @media (prefers-color-scheme: dark) {
      body { background: #16150f; color: #efe7d6; }
      p { color: #c2b9a5; }
      a { background: #efe7d6; border-color: #efe7d6; color: #16150f; }
      a:hover { background: #e0765f; border-color: #e0765f; color: #16150f; }
      hr { border-top-color: #55503f; }
      small { color: #8d8575; }
    }
  </style>
</head>
<body>
  <div class="box">
    <p class="code">500 — server xatosi</p>
    <h1>Nimadir noto'g'ri ketdi</h1>
    <p>Xato qayd etildi va tez orada tuzatiladi. Bir ozdan so'ng qayta urinib ko'ring.</p>
    <a href="/">Bosh sahifaga qaytish</a>
    <hr>
    <small>oldfox.uz</small>
  </div>
</body>
</html>
